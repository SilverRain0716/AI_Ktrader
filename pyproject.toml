[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.0.1"
description = "한국 주식 스윙매매 AI 판단 시스템"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "TA-Lib>=0.7.1",
    "pandas-ta-classic>=0.6.52",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[tool.setuptools]
# 최상위에 docs·schemas·scripts 가 함께 있어 자동 탐색이 실패한다. 실제 패키지만 명시한다.
packages = ["briefing", "data", "data.sources", "decision"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# DART 는 httpx 로 직접 호출한다(dart-fss 미사용). FDR 은 종목 마스터·상장폐지 이력에 쓴다.
data = [
    "finance-datareader>=0.9.202",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001~003: 한글 주석 안의 ×, −, ⚠ 같은 기호를 "혼동되는 유니코드"로 잡는다. 한국어 문서에는 오탐이다.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["net: 외부 네트워크를 타는 테스트 (기본 제외: -m 'not net')"]
addopts = "-m 'not net'"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
